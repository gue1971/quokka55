<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>ありがとうキャッチ</title>
  <style>
    :root {
      --paper: #fff3cf;
      --ink: #4b2f20;
      --orange: #ef7b42;
      --pink: #f29aa3;
      --green: #8ca65d;
      --cream: #fff9e8;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(180deg, #ffe8b7, #fff8de);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
      overflow: hidden;
      touch-action: none;
    }

    #gameWrap {
      width: min(100vw, 430px);
      height: min(100vh, 760px);
      aspect-ratio: 9 / 16;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle at 18% 18%, rgba(255, 198, 118, .28), transparent 24%),
        radial-gradient(circle at 85% 25%, rgba(255, 157, 170, .22), transparent 22%),
        radial-gradient(circle at 50% 80%, rgba(153, 185, 99, .18), transparent 25%),
        var(--paper);
      border: 6px solid #d79a48;
      border-radius: 28px;
      box-shadow: 0 16px 40px rgba(88, 50, 21, .22);
      user-select: none;
    }

    #gameWrap::before {
      content: "";
      position: absolute;
      inset: 14px;
      border: 3px dashed rgba(129, 81, 27, .45);
      border-radius: 20px;
      pointer-events: none;
    }

    .hud {
      position: absolute;
      top: 20px;
      left: 22px;
      right: 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      font-weight: 800;
      text-shadow: 0 2px 0 rgba(255,255,255,.65);
    }

    .badge {
      background: rgba(255, 250, 230, .85);
      border: 3px solid rgba(118, 74, 24, .35);
      border-radius: 999px;
      padding: 7px 12px;
      font-size: 15px;
    }

    #title {
      position: absolute;
      top: 66px;
      left: 18px;
      right: 18px;
      text-align: center;
      z-index: 8;
      pointer-events: none;
    }

    #title .main {
      font-size: 34px;
      line-height: 1;
      font-weight: 950;
      color: var(--orange);
      -webkit-text-stroke: 1px rgba(93, 48, 19, .35);
      text-shadow: 0 4px 0 rgba(255,255,255,.75);
      letter-spacing: .03em;
    }

    #title .sub {
      display: inline-block;
      margin-top: 8px;
      background: rgba(255, 194, 183, .72);
      border: 2px solid rgba(118, 74, 24, .25);
      border-radius: 999px;
      padding: 5px 14px;
      font-weight: 800;
      font-size: 14px;
    }

    #field {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    .item {
      position: absolute;
      left: 0;
      top: 0;
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      font-size: 32px;
      filter: drop-shadow(0 4px 2px rgba(102, 62, 28, .16));
      will-change: transform;
      z-index: 4;
    }

    .item.word {
      width: 112px;
      height: 40px;
      font-size: 18px;
      font-weight: 950;
      color: #e94f6f;
      background: rgba(255, 250, 235, .9);
      border: 3px solid rgba(210, 127, 86, .5);
      border-radius: 999px;
    }

    .item.bad {
      color: #7a5b45;
    }

    #player {
      position: absolute;
      left: 50%;
      bottom: 44px;
      width: 118px;
      height: 118px;
      transform: translateX(-50%);
      z-index: 6;
      display: grid;
      place-items: center;
      will-change: left, transform;
    }

    #quokka {
      width: 110px;
      height: 110px;
      border-radius: 50% 50% 46% 46%;
      background: radial-gradient(circle at 38% 36%, #d9a15f 0 36%, #bd7d3b 75%);
      border: 4px solid #5f3b24;
      position: relative;
      box-shadow: inset 0 -8px 0 rgba(91, 55, 28, .13), 0 8px 0 rgba(103, 63, 25, .12);
    }

    #quokka::before, #quokka::after {
      content: "";
      position: absolute;
      top: -14px;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: #bf7f42;
      border: 4px solid #5f3b24;
      z-index: -1;
    }

    #quokka::before { left: 8px; }
    #quokka::after { right: 8px; }

    .eye {
      position: absolute;
      top: 38px;
      width: 13px;
      height: 18px;
      background: #24170f;
      border-radius: 50%;
    }

    .eye.left { left: 33px; }
    .eye.right { right: 33px; }

    .eye::after {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 4px;
      height: 4px;
      background: white;
      border-radius: 50%;
    }

    .nose {
      position: absolute;
      left: 50%;
      top: 54px;
      width: 20px;
      height: 16px;
      transform: translateX(-50%);
      border-radius: 50%;
      background: #352116;
    }

    .mouth {
      position: absolute;
      left: 50%;
      top: 68px;
      width: 36px;
      height: 22px;
      transform: translateX(-50%);
      border-bottom: 5px solid #352116;
      border-radius: 0 0 30px 30px;
    }

    .cheek {
      position: absolute;
      top: 58px;
      width: 18px;
      height: 10px;
      border-radius: 50%;
      background: rgba(245, 124, 118, .33);
    }

    .cheek.left { left: 18px; }
    .cheek.right { right: 18px; }

    .floatText {
      position: absolute;
      z-index: 12;
      color: #e94f6f;
      font-weight: 950;
      font-size: 18px;
      text-shadow: 0 2px 0 white;
      animation: floatUp .55s ease-out forwards;
      pointer-events: none;
    }

    @keyframes floatUp {
      from { opacity: 1; transform: translate(-50%, 0) scale(1); }
      to { opacity: 0; transform: translate(-50%, -44px) scale(1.18); }
    }

    #overlay {
      position: absolute;
      inset: 0;
      z-index: 30;
      display: grid;
      place-items: center;
      padding: 26px;
      background: rgba(255, 242, 203, .72);
      backdrop-filter: blur(2px);
    }

    .panel {
      width: 100%;
      background: rgba(255, 250, 235, .95);
      border: 4px solid #c6853f;
      border-radius: 26px;
      padding: 24px 18px;
      text-align: center;
      box-shadow: 0 10px 0 rgba(100, 58, 22, .12);
    }

    .panel h1 {
      margin: 0;
      color: var(--orange);
      font-size: 38px;
      line-height: 1.05;
      letter-spacing: .02em;
    }

    .panel p {
      margin: 12px 0 0;
      font-weight: 750;
      line-height: 1.55;
    }

    button {
      margin-top: 20px;
      border: 0;
      border-radius: 999px;
      padding: 13px 24px;
      background: #ef7b42;
      color: white;
      font-size: 18px;
      font-weight: 900;
      box-shadow: 0 6px 0 #b8582b;
      cursor: pointer;
    }

    button:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #b8582b;
    }

    .small {
      font-size: 13px;
      opacity: .78;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="gameWrap" aria-label="ありがとうキャッチ">
    <div class="hud">
      <div class="badge">TIME <span id="time">10.0</span></div>
      <div class="badge">HAPPY <span id="score">0</span></div>
    </div>

    <div id="title">
      <div class="main">ありがとうキャッチ</div>
      <div class="sub">55才になりました・ありがとう</div>
    </div>

    <div id="field"></div>

    <div id="player">
      <div id="quokka">
        <div class="eye left"></div>
        <div class="eye right"></div>
        <div class="nose"></div>
        <div class="mouth"></div>
        <div class="cheek left"></div>
        <div class="cheek right"></div>
      </div>
    </div>

    <div id="overlay">
      <div class="panel" id="startPanel">
        <h1>55才に<br>なりました</h1>
        <p>落ちてくるハートや花を集めて、<br>ありがとうをいっぱい届けよう。</p>
        <button id="startBtn">スタート</button>
        <p class="small">左右にスワイプ、または左右タップで移動</p>
      </div>
      <div class="panel hidden" id="resultPanel">
        <h1>ありがとう！</h1>
        <p id="resultText"></p>
        <button id="againBtn">もう一回</button>
      </div>
    </div>
  </div>

  <script>
    const wrap = document.getElementById('gameWrap');
    const field = document.getElementById('field');
    const player = document.getElementById('player');
    const timeEl = document.getElementById('time');
    const scoreEl = document.getElementById('score');
    const overlay = document.getElementById('overlay');
    const startPanel = document.getElementById('startPanel');
    const resultPanel = document.getElementById('resultPanel');
    const resultText = document.getElementById('resultText');
    const startBtn = document.getElementById('startBtn');
    const againBtn = document.getElementById('againBtn');

    const GAME_SECONDS = 10;
    const PLAYER_WIDTH = 118;
    const items = [];
    let running = false;
    let score = 0;
    let playerX = 0.5;
    let lastTime = 0;
    let elapsed = 0;
    let spawnTimer = 0;
    let pointerDown = false;

    const itemTypes = [
      { label: '♡', kind: 'good', points: 10, size: 48, weight: 32 },
      { label: '🌸', kind: 'good', points: 7, size: 48, weight: 22 },
      { label: '🍓', kind: 'good', points: 8, size: 48, weight: 18 },
      { label: '✨', kind: 'good', points: 6, size: 48, weight: 18 },
      { label: 'ありがとう', kind: 'word', points: 20, size: 112, weight: 8 },
      { label: '！', kind: 'bad', points: -8, size: 48, weight: 7 },
      { label: '💤', kind: 'bad', points: -5, size: 48, weight: 5 },
    ];

    function weightedType() {
      const total = itemTypes.reduce((sum, item) => sum + item.weight, 0);
      let r = Math.random() * total;
      for (const item of itemTypes) {
        r -= item.weight;
        if (r <= 0) return item;
      }
      return itemTypes[0];
    }

    function setPlayerX(normalized) {
      playerX = Math.max(0.13, Math.min(0.87, normalized));
      player.style.left = `${playerX * 100}%`;
    }

    function spawnItem() {
      const type = weightedType();
      const rect = wrap.getBoundingClientRect();
      const x = 26 + Math.random() * (rect.width - type.size - 52);
      const el = document.createElement('div');
      el.className = `item ${type.kind === 'word' ? 'word' : ''} ${type.kind === 'bad' ? 'bad' : ''}`;
      el.textContent = type.label;
      field.appendChild(el);
      items.push({
        el,
        x,
        y: -56,
        speed: 135 + Math.random() * 85,
        drift: -20 + Math.random() * 40,
        type,
        hit: false,
      });
    }

    function rectsOverlap(a, b) {
      return !(a.right < b.left || a.left > b.right || a.bottom < b.top || a.top > b.bottom);
    }

    function popText(text, x, y, good = true) {
      const el = document.createElement('div');
      el.className = 'floatText';
      el.textContent = text;
      el.style.left = `${x}px`;
      el.style.top = `${y}px`;
      el.style.color = good ? '#e94f6f' : '#7a5b45';
      field.appendChild(el);
      setTimeout(() => el.remove(), 620);
    }

    function clearItems() {
      while (items.length) {
        const item = items.pop();
        item.el.remove();
      }
      field.querySelectorAll('.floatText').forEach(el => el.remove());
    }

    function startGame() {
      clearItems();
      score = 0;
      elapsed = 0;
      spawnTimer = 0;
      running = true;
      lastTime = performance.now();
      scoreEl.textContent = '0';
      timeEl.textContent = GAME_SECONDS.toFixed(1);
      overlay.classList.add('hidden');
      setPlayerX(0.5);
      requestAnimationFrame(loop);
    }

    function endGame() {
      running = false;
      overlay.classList.remove('hidden');
      startPanel.classList.add('hidden');
      resultPanel.classList.remove('hidden');

      let comment = 'にこにこありがとう日和！';
      if (score >= 120) comment = 'ハッピー満タン！最高のありがとう！';
      else if (score >= 80) comment = 'かなりハッピー！笑顔がいっぱい！';
      else if (score >= 40) comment = 'やさしいありがとう、届きました！';

      resultText.innerHTML = `HAPPY <strong style="font-size:32px;color:#ef7b42;">${score}</strong><br>${comment}<br><br>55才になりました。ありがとう。`;
    }

    function loop(now) {
      if (!running) return;
      const dt = Math.min(0.033, (now - lastTime) / 1000);
      lastTime = now;
      elapsed += dt;
      spawnTimer -= dt;

      if (spawnTimer <= 0) {
        spawnItem();
        spawnTimer = Math.max(0.24, 0.54 - elapsed * 0.018);
      }

      const remaining = Math.max(0, GAME_SECONDS - elapsed);
      timeEl.textContent = remaining.toFixed(1);

      const playerRect = player.getBoundingClientRect();
      const wrapRect = wrap.getBoundingClientRect();

      for (let i = items.length - 1; i >= 0; i--) {
        const item = items[i];
        item.y += item.speed * dt;
        item.x += item.drift * dt;
        item.el.style.transform = `translate(${item.x}px, ${item.y}px) rotate(${Math.sin((elapsed + i) * 4) * 8}deg)`;

        const itemRect = item.el.getBoundingClientRect();
        if (!item.hit && rectsOverlap(playerRect, itemRect)) {
          item.hit = true;
          score = Math.max(0, score + item.type.points);
          scoreEl.textContent = score;
          const cx = itemRect.left - wrapRect.left + itemRect.width / 2;
          const cy = itemRect.top - wrapRect.top;
          popText(item.type.points > 0 ? `+${item.type.points}` : `${item.type.points}`, cx, cy, item.type.points > 0);
          item.el.remove();
          items.splice(i, 1);
          continue;
        }

        if (item.y > wrapRect.height + 80) {
          item.el.remove();
          items.splice(i, 1);
        }
      }

      if (elapsed >= GAME_SECONDS) {
        endGame();
        return;
      }
      requestAnimationFrame(loop);
    }

    function moveByClientX(clientX) {
      const rect = wrap.getBoundingClientRect();
      setPlayerX((clientX - rect.left) / rect.width);
    }

    wrap.addEventListener('pointerdown', (e) => {
      pointerDown = true;
      moveByClientX(e.clientX);
    });

    wrap.addEventListener('pointermove', (e) => {
      if (!pointerDown) return;
      moveByClientX(e.clientX);
    });

    window.addEventListener('pointerup', () => {
      pointerDown = false;
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') setPlayerX(playerX - 0.08);
      if (e.key === 'ArrowRight') setPlayerX(playerX + 0.08);
      if ((e.key === 'Enter' || e.key === ' ') && !running) startGame();
    });

    startBtn.addEventListener('click', startGame);
    againBtn.addEventListener('click', startGame);
  </script>
</body>
</html>

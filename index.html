<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>ありがとうキャッチ</title>
  <style>
    :root {
      --ink: #4a2c18;
      --orange: #e8772f;
      --pink: #e7838e;
      --green: #7f9b52;
      --paper: #fff3cb;
      --panel: rgba(255, 249, 230, .92);
      --line: rgba(119, 75, 31, .42);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      overflow: hidden;
      touch-action: none;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 50% 8%, rgba(255, 199, 116, .34), transparent 28%),
        linear-gradient(180deg, #ffdca5, #fff8dd);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    }

    #gameWrap {
      position: relative;
      width: min(100vw, 430px);
      height: min(100vh, 760px);
      aspect-ratio: 9 / 16;
      overflow: hidden;
      border: 6px solid #c98535;
      border-radius: 26px;
      background: var(--paper) url("assets/game-background.png") center / cover no-repeat;
      box-shadow: 0 18px 42px rgba(85, 48, 18, .24);
      user-select: none;
      isolation: isolate;
    }

    #gameWrap::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        linear-gradient(180deg, rgba(255, 247, 218, .68), rgba(255, 247, 218, .2) 24%, rgba(255, 247, 218, .06) 72%, rgba(255, 241, 202, .3)),
        radial-gradient(circle at 50% 50%, rgba(255, 255, 244, .5), transparent 54%);
    }

    .hud {
      position: absolute;
      top: 18px;
      left: 20px;
      right: 20px;
      z-index: 10;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      font-weight: 900;
    }

    .badge {
      min-width: 0;
      border: 3px solid var(--line);
      border-radius: 999px;
      padding: 8px 12px;
      background: rgba(255, 251, 235, .88);
      box-shadow: 0 3px 0 rgba(112, 69, 24, .12);
      text-align: center;
      font-size: 14px;
      text-shadow: 0 2px 0 rgba(255, 255, 255, .7);
    }

    #mvpLink {
      position: absolute;
      top: 68px;
      right: 22px;
      z-index: 11;
      color: #74431e;
      background: rgba(255, 251, 235, .82);
      border: 2px solid rgba(121, 78, 32, .34);
      border-radius: 999px;
      padding: 5px 10px;
      font-size: 12px;
      font-weight: 800;
      text-decoration: none;
    }

    #musicToggle {
      position: absolute;
      top: 66px;
      left: 22px;
      z-index: 40;
      min-width: 86px;
      margin: 0;
      border: 2px solid rgba(121, 78, 32, .38);
      border-radius: 999px;
      padding: 6px 11px;
      background: rgba(255, 251, 235, .9);
      color: #74431e;
      box-shadow: 0 3px 0 rgba(112, 69, 24, .14);
      font-size: 12px;
      font-weight: 950;
      line-height: 1;
    }

    #musicToggle.is-on {
      border-color: rgba(126, 155, 82, .64);
      background: rgba(238, 249, 214, .92);
      color: #4d6f2d;
    }

    #title {
      position: absolute;
      top: 82px;
      left: 18px;
      right: 18px;
      z-index: 9;
      pointer-events: none;
      text-align: center;
    }

    #title .main {
      display: inline-block;
      color: var(--orange);
      font-size: 35px;
      font-weight: 950;
      line-height: 1;
      letter-spacing: 0;
      -webkit-text-stroke: 1px rgba(75, 43, 20, .4);
      text-shadow: 0 4px 0 rgba(255, 255, 255, .78), 0 7px 0 rgba(118, 73, 27, .1);
      transform: rotate(-1deg);
    }

    #title .sub {
      display: inline-block;
      margin-top: 9px;
      border: 2px solid rgba(125, 75, 31, .24);
      border-radius: 999px;
      padding: 5px 13px;
      background: rgba(244, 160, 149, .72);
      font-size: 14px;
      font-weight: 900;
      box-shadow: 0 3px 0 rgba(116, 67, 24, .08);
    }

    #field {
      position: absolute;
      inset: 0;
      z-index: 5;
      overflow: hidden;
    }

    .item {
      position: absolute;
      left: 0;
      top: 0;
      width: 52px;
      height: 52px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      font-size: 34px;
      filter: drop-shadow(0 5px 2px rgba(87, 51, 22, .18));
      will-change: transform;
    }

    .item.good {
      background: rgba(255, 251, 233, .56);
      border: 2px solid rgba(196, 120, 62, .15);
    }

    .item.word {
      width: 118px;
      height: 42px;
      color: #db4f68;
      border: 3px solid rgba(207, 117, 77, .46);
      border-radius: 999px;
      background: rgba(255, 250, 232, .9);
      font-size: 18px;
      font-weight: 950;
    }

    .item.bad {
      color: #76513b;
      background: rgba(255, 250, 232, .7);
      border: 2px dashed rgba(111, 72, 38, .32);
    }

    #player {
      position: absolute;
      left: 50%;
      bottom: 24px;
      z-index: 8;
      width: 136px;
      height: 176px;
      transform: translateX(-50%);
      display: grid;
      place-items: end center;
      will-change: left, transform;
    }

    #player::before {
      content: "";
      position: absolute;
      bottom: 5px;
      width: 95px;
      height: 18px;
      border-radius: 50%;
      background: rgba(95, 57, 24, .18);
      filter: blur(1px);
    }

    #quokkaImg {
      position: relative;
      width: 136px;
      height: 176px;
      object-fit: cover;
      object-position: center 46%;
      border-radius: 44% 44% 38% 38%;
      mix-blend-mode: multiply;
      filter: saturate(1.08) contrast(1.02) drop-shadow(0 6px 0 rgba(107, 66, 27, .12));
      pointer-events: none;
    }

    .floatText {
      position: absolute;
      z-index: 12;
      color: #e2526d;
      font-size: 18px;
      font-weight: 950;
      text-shadow: 0 2px 0 white;
      animation: floatUp .58s ease-out forwards;
      pointer-events: none;
    }

    @keyframes floatUp {
      from { opacity: 1; transform: translate(-50%, 0) scale(1); }
      to { opacity: 0; transform: translate(-50%, -46px) scale(1.18); }
    }

    #overlay {
      position: absolute;
      inset: 0;
      z-index: 30;
      display: grid;
      place-items: center;
      padding: 24px;
      background: rgba(255, 242, 203, .66);
      backdrop-filter: blur(2px);
    }

    .panel {
      width: 100%;
      border: 4px solid #be7d36;
      border-radius: 24px;
      padding: 24px 18px;
      background: var(--panel);
      box-shadow: 0 10px 0 rgba(99, 58, 23, .13);
      text-align: center;
    }

    .panel h1 {
      margin: 0;
      color: var(--orange);
      font-size: 38px;
      line-height: 1.06;
      letter-spacing: 0;
      text-shadow: 0 3px 0 rgba(255, 255, 255, .78);
    }

    .panel p {
      margin: 12px 0 0;
      font-weight: 800;
      line-height: 1.55;
    }

    button {
      margin-top: 20px;
      border: 0;
      border-radius: 999px;
      padding: 13px 25px;
      background: var(--orange);
      color: white;
      box-shadow: 0 6px 0 #aa5527;
      cursor: pointer;
      font-size: 18px;
      font-weight: 950;
      font-family: inherit;
    }

    button:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #aa5527;
    }

    .small {
      font-size: 13px;
      opacity: .78;
    }

    .hidden {
      display: none !important;
    }

    @media (max-height: 660px) {
      #title {
        top: 74px;
      }

      #title .main {
        font-size: 30px;
      }

      #player {
        width: 118px;
        height: 150px;
        bottom: 18px;
      }

      #quokkaImg {
        width: 118px;
        height: 150px;
      }
    }
  </style>
</head>
<body>
  <div id="gameWrap" aria-label="ありがとうキャッチ">
    <div class="hud">
      <div class="badge">TIME <span id="time">15.0</span></div>
      <div class="badge">HAPPY <span id="score">0</span></div>
    </div>

    <button id="musicToggle" type="button" aria-pressed="false">BGM OFF</button>
    <a id="mvpLink" href="mvp/index.html" aria-label="MVPバージョンを開く">MVP</a>

    <div id="title">
      <div class="main">ありがとうキャッチ</div>
      <div class="sub">55才になりました・ありがとう</div>
    </div>

    <div id="field"></div>

    <div id="player">
      <img id="quokkaImg" src="assets/quokka-player.png" alt="笑顔のクオッカ" draggable="false" />
    </div>

    <div id="overlay">
      <div class="panel" id="startPanel">
        <h1>55才に<br>なりました</h1>
        <p>クオッカといっしょに、<br>ハートや花をたくさん集めよう。</p>
        <button id="startBtn">スタート</button>
        <p class="small">左右にスワイプ、または左右タップで移動</p>
      </div>
      <div class="panel hidden" id="resultPanel">
        <h1>ありがとう！</h1>
        <p id="resultText"></p>
        <button id="againBtn">もう一回</button>
      </div>
    </div>

    <audio id="bgm" src="assets/quokka-kettle.mp3" loop preload="auto"></audio>
  </div>

  <script>
    const wrap = document.getElementById('gameWrap');
    const field = document.getElementById('field');
    const player = document.getElementById('player');
    const timeEl = document.getElementById('time');
    const scoreEl = document.getElementById('score');
    const overlay = document.getElementById('overlay');
    const startPanel = document.getElementById('startPanel');
    const resultPanel = document.getElementById('resultPanel');
    const resultText = document.getElementById('resultText');
    const startBtn = document.getElementById('startBtn');
    const againBtn = document.getElementById('againBtn');
    const musicToggle = document.getElementById('musicToggle');
    const bgm = document.getElementById('bgm');

    const GAME_SECONDS = 15;
    const items = [];
    let running = false;
    let score = 0;
    let playerX = 0.5;
    let lastTime = 0;
    let elapsed = 0;
    let spawnTimer = 0;
    let pointerDown = false;
    let musicOn = false;
    let audioContext = null;

    const itemTypes = [
      { label: '♡', kind: 'good', points: 10, size: 52, weight: 28 },
      { label: '🌸', kind: 'good', points: 8, size: 52, weight: 20 },
      { label: '🍓', kind: 'good', points: 9, size: 52, weight: 16 },
      { label: '🌿', kind: 'good', points: 7, size: 52, weight: 14 },
      { label: '✨', kind: 'good', points: 6, size: 52, weight: 16 },
      { label: 'ありがとう', kind: 'word', points: 22, size: 118, weight: 8 },
      { label: '！', kind: 'bad', points: -8, size: 52, weight: 7 },
      { label: '💤', kind: 'bad', points: -6, size: 52, weight: 5 },
    ];

    function weightedType() {
      const total = itemTypes.reduce((sum, item) => sum + item.weight, 0);
      let r = Math.random() * total;
      for (const item of itemTypes) {
        r -= item.weight;
        if (r <= 0) return item;
      }
      return itemTypes[0];
    }

    function setPlayerX(normalized) {
      playerX = Math.max(0.16, Math.min(0.84, normalized));
      player.style.left = `${playerX * 100}%`;
    }

    function spawnItem() {
      const type = weightedType();
      const rect = wrap.getBoundingClientRect();
      const x = 22 + Math.random() * (rect.width - type.size - 44);
      const el = document.createElement('div');
      el.className = `item ${type.kind === 'word' ? 'word' : type.kind} ${type.kind === 'bad' ? 'bad' : ''}`;
      el.textContent = type.label;
      field.appendChild(el);
      items.push({
        el,
        x,
        y: -60,
        speed: 132 + Math.random() * 92,
        drift: -24 + Math.random() * 48,
        wobble: Math.random() * Math.PI * 2,
        type,
        hit: false,
      });
    }

    function rectsOverlap(a, b) {
      return !(a.right < b.left || a.left > b.right || a.bottom < b.top || a.top > b.bottom);
    }

    function popText(text, x, y, good = true) {
      const el = document.createElement('div');
      el.className = 'floatText';
      el.textContent = text;
      el.style.left = `${x}px`;
      el.style.top = `${y}px`;
      el.style.color = good ? '#e2526d' : '#76513b';
      field.appendChild(el);
      setTimeout(() => el.remove(), 650);
    }

    function clearItems() {
      while (items.length) {
        const item = items.pop();
        item.el.remove();
      }
      field.querySelectorAll('.floatText').forEach(el => el.remove());
    }

    function getAudioContext() {
      if (!audioContext) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return null;
        audioContext = new AudioContextClass();
      }
      if (audioContext.state === 'suspended') {
        audioContext.resume();
      }
      return audioContext;
    }

    function playCatchSound(points) {
      const ctx = getAudioContext();
      if (!ctx) return;

      const now = ctx.currentTime;
      const gain = ctx.createGain();
      gain.connect(ctx.destination);
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(points > 0 ? 0.16 : 0.1, now + 0.012);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + (points > 0 ? 0.22 : 0.18));

      const first = ctx.createOscillator();
      const second = ctx.createOscillator();
      first.type = 'sine';
      second.type = points > 0 ? 'triangle' : 'sine';

      if (points > 0) {
        first.frequency.setValueAtTime(660, now);
        first.frequency.exponentialRampToValueAtTime(990, now + 0.1);
        second.frequency.setValueAtTime(1320, now + 0.055);
        second.frequency.exponentialRampToValueAtTime(1760, now + 0.16);
      } else {
        first.frequency.setValueAtTime(260, now);
        first.frequency.exponentialRampToValueAtTime(160, now + 0.13);
        second.frequency.setValueAtTime(190, now + 0.03);
        second.frequency.exponentialRampToValueAtTime(120, now + 0.16);
      }

      first.connect(gain);
      second.connect(gain);
      first.start(now);
      second.start(now + (points > 0 ? 0.055 : 0.03));
      first.stop(now + (points > 0 ? 0.18 : 0.16));
      second.stop(now + (points > 0 ? 0.22 : 0.18));
    }

    function syncMusicButton() {
      musicToggle.textContent = musicOn ? 'BGM ON' : 'BGM OFF';
      musicToggle.setAttribute('aria-pressed', musicOn ? 'true' : 'false');
      musicToggle.classList.toggle('is-on', musicOn);
    }

    async function playMusic() {
      if (!musicOn) return;
      bgm.volume = 0.42;
      try {
        await bgm.play();
      } catch {
        bgm.pause();
      }
    }

    function stopMusic() {
      bgm.pause();
    }

    function toggleMusic() {
      musicOn = !musicOn;
      syncMusicButton();
      if (musicOn) {
        playMusic();
      } else {
        stopMusic();
      }
    }

    function startGame() {
      getAudioContext();
      clearItems();
      score = 0;
      elapsed = 0;
      spawnTimer = 0;
      running = true;
      lastTime = performance.now();
      scoreEl.textContent = '0';
      timeEl.textContent = GAME_SECONDS.toFixed(1);
      overlay.classList.add('hidden');
      setPlayerX(0.5);
      playMusic();
      requestAnimationFrame(loop);
    }

    function endGame() {
      running = false;
      overlay.classList.remove('hidden');
      startPanel.classList.add('hidden');
      resultPanel.classList.remove('hidden');

      let comment = 'にこにこありがとう日和！';
      if (score >= 170) comment = 'ハッピー満タン！最高のありがとう！';
      else if (score >= 120) comment = 'かなりハッピー！笑顔がいっぱい！';
      else if (score >= 70) comment = 'やさしいありがとう、届きました！';

      resultText.innerHTML = `HAPPY <strong style="font-size:32px;color:#e8772f;">${score}</strong><br>${comment}<br><br>55才になりました。ありがとう。`;
    }

    function loop(now) {
      if (!running) return;
      const dt = Math.min(0.033, (now - lastTime) / 1000);
      lastTime = now;
      elapsed += dt;
      spawnTimer -= dt;

      if (spawnTimer <= 0) {
        spawnItem();
        spawnTimer = Math.max(0.22, 0.5 - elapsed * 0.012);
      }

      const remaining = Math.max(0, GAME_SECONDS - elapsed);
      timeEl.textContent = remaining.toFixed(1);

      const playerRect = player.getBoundingClientRect();
      const wrapRect = wrap.getBoundingClientRect();
      const playerHitRect = {
        left: playerRect.left + 18,
        right: playerRect.right - 18,
        top: playerRect.top + 28,
        bottom: playerRect.bottom - 8,
      };

      for (let i = items.length - 1; i >= 0; i--) {
        const item = items[i];
        item.y += item.speed * dt;
        item.x += item.drift * dt;
        const sway = Math.sin(elapsed * 4 + item.wobble) * 7;
        const rotate = Math.sin(elapsed * 5 + item.wobble) * 9;
        item.el.style.transform = `translate(${item.x + sway}px, ${item.y}px) rotate(${rotate}deg)`;

        const itemRect = item.el.getBoundingClientRect();
        if (!item.hit && rectsOverlap(playerHitRect, itemRect)) {
          item.hit = true;
          playCatchSound(item.type.points);
          score = Math.max(0, score + item.type.points);
          scoreEl.textContent = score;
          const cx = itemRect.left - wrapRect.left + itemRect.width / 2;
          const cy = itemRect.top - wrapRect.top;
          popText(item.type.points > 0 ? `+${item.type.points}` : `${item.type.points}`, cx, cy, item.type.points > 0);
          item.el.remove();
          items.splice(i, 1);
          continue;
        }

        if (item.y > wrapRect.height + 84) {
          item.el.remove();
          items.splice(i, 1);
        }
      }

      if (elapsed >= GAME_SECONDS) {
        endGame();
        return;
      }
      requestAnimationFrame(loop);
    }

    function moveByClientX(clientX) {
      const rect = wrap.getBoundingClientRect();
      setPlayerX((clientX - rect.left) / rect.width);
    }

    wrap.addEventListener('pointerdown', (e) => {
      if (e.target.closest('a, button')) return;
      pointerDown = true;
      moveByClientX(e.clientX);
    });

    wrap.addEventListener('pointermove', (e) => {
      if (!pointerDown) return;
      moveByClientX(e.clientX);
    });

    window.addEventListener('pointerup', () => {
      pointerDown = false;
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') setPlayerX(playerX - 0.08);
      if (e.key === 'ArrowRight') setPlayerX(playerX + 0.08);
      if ((e.key === 'Enter' || e.key === ' ') && !running) startGame();
    });

    startBtn.addEventListener('click', startGame);
    againBtn.addEventListener('click', startGame);
    musicToggle.addEventListener('click', toggleMusic);
    syncMusicButton();
  </script>
</body>
</html>
